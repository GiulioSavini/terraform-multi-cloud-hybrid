name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here is allowed to fail the build. That is the point: a pipeline
# that reports green regardless of its findings provides no signal, and an
# earlier version of this workflow had been narrowed until nothing could fail.
# If a check is too noisy, fix the finding or delete the check — do not
# neutralise it with continue-on-error.

env:
  TF_VERSION: "1.9.8"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: Validate ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - platform/naming
          - platform/tagging
          - compliance/controls
          - domains/networking
          - domains/access-control
          - domains/workload-hosting
          - domains/service-discovery
          - domains/observability
          - applications/landing-zone
          - deployments/dev
          - deployments/stg
          - deployments/prd
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init and validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  boundaries:
    name: Bounded context boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No cross-context reach into adapters
        run: ./scripts/check-boundaries.sh

  policy:
    name: Policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-conftest@v0.4.0
      - name: Verify compliance policies
        run: conftest verify --policy compliance/policies

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
      - run: tflint --recursive --minimum-failure-severity=warning

  security:
    name: Trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform for misconfiguration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          # Findings fail the build. Suppressions belong in .trivyignore with a
          # written reason, not in the exit code.
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
